name: 禁漫天堂每日自动签到

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios crypto-js

      - name: Run JM daily checkin
        env:
          JM_ACCOUNT: ${{ secrets.JM_ACCOUNT }}
          JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
        run: node scripts/daily-checkin.js

      - name: Server酱³ 通知
        if: always()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SENDKEY" ]; then
            echo "未配置 SERVERCHAN_SENDKEY，跳过通知"
            exit 0
          fi

          UID_NUM=$(echo "$SENDKEY" | sed -n 's/^sctp\([0-9]*\)t.*/\1/p')
          if [ -z "$UID_NUM" ]; then
            echo "SendKey 格式不正确，应为 sctp... 开头"
            exit 1
          fi

          URL="https://${UID_NUM}.push.ft07.com/send/${SENDKEY}.send"

          if [ "$STATUS" = "success" ]; then
            TITLE="【禁漫每日签到】"
            STATUS_CN="成功"
          else
            TITLE="【禁漫每日签到】"
            STATUS_CN="失败"
          fi

          DESP=$(printf '状态: %s\n仓库: %s\n日志: %s' "$STATUS_CN" "${{ github.repository }}" "$RUN_URL")

          curl -sS -X POST "$URL" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "desp=${DESP}"
